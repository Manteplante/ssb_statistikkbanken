name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Offline only. The live SSB/KLASS tests are marked `network` and deselected
# here and in addopts -- run them locally with `make test-net`.
jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # --no-group notebook skips the GDAL/PROJ/pyogrio wheel chain, which only
      # the analysis notebooks need. --locked fails if uv.lock is out of date
      # with pyproject.toml (fix with `uv lock && git commit uv.lock`).
      - name: Sync dependencies
        run: uv sync --locked --no-group notebook --python 3.14

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy src

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The two ends of the supported range: the floor from requires-python,
      # and the version .python-version pins for local development.
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --no-group notebook --python ${{ matrix.python-version }}

      - name: Show interpreter
        run: uv run --no-sync python -c "import sys; print(sys.version)"

      - name: pytest (offline)
        run: uv run --no-sync pytest -m "not network"
