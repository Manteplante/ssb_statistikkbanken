name: CI

# Two triggers on purpose:
#   push  -- every branch, so a feature branch is checked from its first push,
#            before anyone opens a PR.
#   pull_request -- into main or dev only. This one runs against the *merge
#            result*, which is what branch protection actually gates on.
# A PR from a branch in this repo therefore runs twice. That's the cost of
# knowing a feature branch is green before you raise the PR.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# push and pull_request get different refs (refs/heads/x vs refs/pull/N/merge),
# so these two never cancel each other -- only superseded pushes to the same
# branch are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Offline only. The live SSB/KLASS tests are marked `network` and deselected
# here and in addopts -- run them locally with `make test-net`.
jobs:
  # Enforces feature branch -> dev -> main. Rulesets can require a PR, but they
  # can't say where the PR came from, so this job says it instead.
  branch-flow:
    name: branch flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check where this PR came from
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::PRs into main must come from dev, but this one is from '$HEAD'." \
                 "Retarget it at dev, then open dev -> main once it's merged."
            exit 1
          fi
          echo "$HEAD -> $BASE: ok"

  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      # --no-group notebook skips the GDAL/PROJ/pyogrio wheel chain, which only
      # the analysis notebooks need. --locked fails if uv.lock is out of date
      # with pyproject.toml (fix with `uv lock && git commit uv.lock`).
      - name: Sync dependencies
        run: uv sync --locked --no-group notebook --python 3.14

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: mypy
        run: uv run --no-sync mypy src

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A matrix of one: 3.14 is what .python-version pins and what everyone
      # here develops on. Kept as a matrix so the version appears in the job
      # name (and so the required status check names it), and so adding a leg
      # back later is a one-line change.
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --no-group notebook --python ${{ matrix.python-version }}

      - name: Show interpreter
        run: uv run --no-sync python -c "import sys; print(sys.version)"

      - name: pytest (offline)
        run: uv run --no-sync pytest -m "not network"
