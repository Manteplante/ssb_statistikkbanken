[project]
name = "ssb-statistikkbanken"
version = "0.2.0.dev0"
description = "Ergonomic Python wrapper around SSB's Statistikkbanken (PxWebApi v2) and KLASS, built on pxwebpy."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Manteplante", email = "matiasmantepizarro@gmail.com" }
]
dependencies = [
    "pandas>=3.0.5",
    "pxwebpy>=0.6.0",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.14",
    "mypy>=1.18",
]
# Only the notebooks need these; nothing under src/ imports them, so CI skips
# the whole GDAL/PROJ wheel chain with `uv sync --no-group notebook`.
notebook = [
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[build-system]
# Installed editable into .venv on `uv sync`, so `import ssb_statistikkbanken`
# works with no sys.path hack -- and installable elsewhere via
# `uv add git+https://github.com/Manteplante/ssb_statistikkbanken`.
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not network'"
markers = [
    "network: hits the live SSB/KLASS APIs (deselected by default; run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff lints .ipynb by default. maps/ and the notebooks below still import the
# removed src.fetcher, so they're excluded until ported; everything else in
# eda/, including new notebooks scaffolded via `make notebook`, is linted.
extend-exclude = [
    "maps",
    "eda/ssb_norwegian_population_growth.ipynb",
    "eda/ssb_norwegian_population_powerbi_ready.ipynb",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401", # `Any` is the honest type for pxwebpy payloads, **kwargs and record cells
    "RUF001", # the en dash and middle dot in the Jupyter HTML card are deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",    # test functions and fixtures are deliberately unannotated
    "SIM117", # nested `with pytest.raises(...): with wrap_pxweb_errors(...)` reads better
]

[tool.ruff.lint.isort]
known-first-party = ["ssb_statistikkbanken"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
pretty = true

# The useful two-thirds of `strict`, pinned individually so a mypy upgrade
# cannot silently add a new failure class to CI.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
# warn_unreachable stays off: normalize_records validates its own Literal-typed
# parameters at runtime because its callers are untyped notebook cells, and mypy
# would flag those guards as dead code.

[[tool.mypy.overrides]]
# pandas 3.0.5 ships no py.typed; polars is an optional runtime import.
module = ["pandas.*", "polars.*"]
ignore_missing_imports = true
